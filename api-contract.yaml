  /content/{content_id}/rating:
    get:
      tags: [Content]
      summary: Get the current device rating for content
      description: |
        Returns the authenticated anonymous device's current rating for one mobile-visible content
        item. Device identity is derived only from `MobileAnonymousBearer`; no device identifier is
        accepted from the request.

        If the content is mobile-visible but the authenticated device has never rated it, the API
        returns `200` with `rating: null`. This lets the client distinguish "not rated yet" from
        "content does not exist / is not mobile-visible".

        Missing, unpublished, archived, draft, review-state, or otherwise non-mobile-visible content
        returns `404 NOT_FOUND`. The endpoint does not expose another device's rating.
      security:
      - MobileAnonymousBearer: []
      parameters:
      - name: content_id
        in: path
        required: true
        description: Content identifier (`content_id` from `GET /content`).
        schema:
          type: integer
          minimum: 1
        example: 44
      responses:
        '200':
          description: Current rating state for the authenticated anonymous device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentCurrentRatingResponse'
              examples:
                rated:
                  summary: The device has already rated this content
                  value:
                    content_id: 44
                    rating: 4
                not_rated:
                  summary: The device has not rated this content yet
                  value:
                    content_id: 44
                    rating:
        '401':
          $ref: '#/components/responses/ProtectedMobileUnauthorized'
        '404':
          description: Content not found or not mobile-visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "NOT_FOUND"
                message: "Content not found."
        '429':
          $ref: '#/components/responses/TooManyRequests'

    put:
      tags: [Content]
      summary: Set the current device rating for content
      description: |
        Sets the authenticated anonymous device's current rating for one mobile-visible content item.
        The server derives the authenticated device identity from the anonymous JWT. Device identity
        is not accepted from the request body.

        There is one current rating for each authenticated device and content item. A later PUT
        replaces the current rating. The operation does not maintain rating history and does not
        create reviews, likes, reactions, or moderation data.

        Missing, unpublished, archived, draft, review-state, or otherwise non-mobile-visible content
        returns the same `404 NOT_FOUND` response so the operation does not reveal internal content.
      security:
      - MobileAnonymousBearer: []
      parameters:
      - name: content_id
        in: path
        required: true
        description: Content identifier (`content_id` from `GET /content`).
        schema:
          type: integer
          minimum: 1
        example: 44
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetContentRatingRequest'
            example:
              rating: 4
      responses:
        '200':
          description: Current rating set for the authenticated anonymous device
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentRatingResponse'
              example:
                content_id: 44
                rating: 4
        '401':
          $ref: '#/components/responses/ProtectedMobileUnauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: Content not found or not mobile-visible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "NOT_FOUND"
                message: "Content not found."
        '422':
          description: Rating validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "VALIDATION_ERROR"
                message: "rating must be between 1 and 5."
        '429':
          $ref: '#/components/responses/TooManyRequests'
