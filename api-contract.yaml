    UpdateDeviceProfileRequest:
      schema: '#/components/schemas/UpdateDeviceProfileRequest'
      fields: [age_range, gender, language, is_pregnant, fcm_token]
    DeviceProfileResponse:
      schema: '#/components/schemas/DeviceProfileResponse'
      fields: [device_uuid, user_type, age_range, gender, family_situation, language, is_pregnant, fcm_token, created_at]
    AssessmentAnswerOptionResponse:
      schema: '#/components/schemas/AssessmentAnswerOptionResponse'
      fields: [option_id, label]
    AssessmentQuestionResponse:
      schema: '#/components/schemas/AssessmentQuestionResponse'
      fields: [question_id, text, options]
    AssessmentQuizResponse:
      schema: '#/components/schemas/AssessmentQuizResponse'
      fields: [quiz_id, version, title, questions]
    SubmitAssessmentAnswer:
      schema: '#/components/schemas/SubmitAssessmentAnswer'
      fields: [question_id, option_id]
    SubmitAssessmentResultRequest:
      schema: '#/components/schemas/SubmitAssessmentResultRequest'
      fields: [quiz_id, answers]
    AssessmentResultResponse:
      schema: '#/components/schemas/AssessmentResultResponse'
      fields: [result_id, quiz_id, quiz_version, risk_level, orientation, recommend_center, completed_at]
    CreateSessionRequest:
      schema: '#/components/schemas/CreateSessionRequest'
      fields: [device_uuid, platform, app_version]
    EndSessionRequest:
      schema: '#/components/schemas/EndSessionRequest'
      fields: [duration_sec]
    SessionResponse:
      schema: '#/components/schemas/SessionResponse'
      fields: [id, device_uuid, started_at, duration_sec, platform, app_version, access_token, token_type, expires_in]
    Region:
