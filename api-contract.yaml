  /content:
    get:
      tags: [Content]
      summary: List published content
      description: |
        Returns a paginated list of published educational content visible to the mobile app.
        This MVP read endpoint is public and does not require `MobileAnonymousBearer`.
        Analytics and tracking remain separate through `POST /events`.

        Visibility rules:
        - Only `PUBLISHED` content is returned.
        - `DRAFT`, `READY_FOR_REVIEW`, and `ARCHIVED` content is hidden.
        - `TEXT` content may be returned without a media asset.
        - `VIDEO`, `AUDIO`, and `BANNER` content is returned only when it has an eligible READY public media asset; the server generates the public URL at read time.
        - Internal storage and processing fields are never exposed.

        Public delivery selection:
        - `asset_url` and `thumbnail_url` are absolute public URLs generated by the server at read time.
          Treat them as opaque: do not construct `/media` paths, derive storage keys, assume a hostname,
          or persist the returned URL as a stable content identifier.
        - `TEXT` and `EVENT` content do not require `asset_url`; it is null for both.
        - `EVENT` is visible only when it has valid non-empty Markdown and an eligible READY
          custom thumbnail. Its newest eligible READY custom thumbnail (creation time descending,
          then asset id descending) is returned as `thumbnail_url` and is its cover image.
        - `BANNER` content uses its newest eligible READY banner asset (creation time descending, then asset id descending).
        - `VIDEO` content is visible only when an eligible READY HLS playlist exists; its `.m3u8`
          playlist URL is returned as `asset_url`. Relative HLS segment URLs are resolved by the player.
        - `AUDIO` content uses its eligible READY audio asset.
        - `thumbnail_url` is selected by the server using this precedence:
          - VIDEO: custom thumbnail, then generated video-frame thumbnail; otherwise null.
          - AUDIO: custom thumbnail, then generated waveform thumbnail, then the standard audio thumbnail.
          - TEXT: custom thumbnail, then the standard text thumbnail.
          - EVENT: newest eligible READY custom thumbnail; it is required.
          - BANNER: custom thumbnail when present; otherwise null.
        - URLs returned in `asset_url` / `thumbnail_url` can be requested without
          `MobileAnonymousBearer`; the server still re-checks publication/readiness on each request.
        - Internal Garage addresses, storage keys, ORIGINAL video files, and processing assets are not exposed.

        Default sorting is deterministic:
        - `is_highlighted` descending (`true` first).
        - `published_at` descending.
        - `content_id` ascending.

        Because this endpoint documents `429`, the implementation must include
        the established `ContentReads` rate-limit policy.
      parameters:
      - name: language
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/Language'
        description: |
          Filter by content language. When omitted, French and Arabic items are mixed, so the app
          sends its language.
      - name: thematic_id
        in: query
        required: false
        schema:
          type: integer
        description: Filter by thematic.
      - name: content_type
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/ContentType'
        description: Filter by content type.
      - name: is_highlighted
        in: query
        required: false
        schema:
          type: boolean
        description: |
          Optional exact highlight filter. `true` returns only highlighted content; `false`
          returns only non-highlighted content. When omitted, no highlight filter is applied.
          The default highlight-first ordering still applies to the resulting set.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number.
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
        description: Number of items per page.
      responses:
        '200':
          description: Published content page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentPage'
              example:
                items:
                - content_id: 44
                  thematic_id: 2
                  thematic_name: "Infections virales"
                  title: "Prévenir les hépatites virales"
                  summary: "Gestes de prévention et situations où demander conseil."
                  content_type: "VIDEO"
                  language: "fr"
                  is_highlighted: true
                  asset_url: "https://media.example.msps.test/media/content/44/hls/asset-81-attempt-1/master.m3u8"
                  thumbnail_url: "https://media.example.msps.test/media/content/44/thumbnail/poster.jpg"
                  duration_seconds: 143
                  published_at: "2026-08-09T11:00:00Z"
                page: 1
                page_size: 20
                total_count: 1
        '422':
          description: Validation error (invalid filters or pagination values)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: "VALIDATION_ERROR"
                message: "Invalid pagination value."
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /content/{content_id}:
    get:
      tags: [Content]
      summary: Get published content detail
      description: |
        Returns detail for one published educational content item visible to the mobile app.
        This MVP read endpoint is public and does not require `MobileAnonymousBearer`.
        Analytics and tracking remain separate through `POST /events`.

        Visibility rules:
        - Return `404` when content does not exist.
        - Return `404` when content exists but is not `PUBLISHED`.
        - Return `404` when media content exists but has no eligible READY public media asset.
        - Do not reveal whether unpublished or internal content exists.

        Public delivery selection:
        - `asset_url` and `thumbnail_url` are absolute public URLs generated by the server at read time.
          Treat them as opaque: do not construct `/media` paths, derive storage keys, assume a hostname,
          or persist the returned URL as a stable content identifier.
        - `TEXT` and `EVENT` content do not require `asset_url`; it is null for both.
        - `EVENT` is visible only when it has valid non-empty Markdown and an eligible READY
          custom thumbnail. Its newest eligible READY custom thumbnail (creation time descending,
          then asset id descending) is returned as `thumbnail_url` and is its cover image.
        - `BANNER` content uses its newest eligible READY banner asset (creation time descending, then asset id descending).
        - `VIDEO` content is visible only when an eligible READY HLS playlist exists; its `.m3u8`
          playlist URL is returned as `asset_url`. Relative HLS segment URLs are resolved by the player.
        - `AUDIO` content uses its eligible READY audio asset.
        - `thumbnail_url` is selected by the server using this precedence:
          - VIDEO: custom thumbnail, then generated video-frame thumbnail; otherwise null.
          - AUDIO: custom thumbnail, then generated waveform thumbnail, then the standard audio thumbnail.
          - TEXT: custom thumbnail, then the standard text thumbnail.
          - EVENT: newest eligible READY custom thumbnail; it is required.
          - BANNER: custom thumbnail when present; otherwise null.
        - URLs returned in `asset_url` / `thumbnail_url` can be requested without
          `MobileAnonymousBearer`; the server still re-checks publication/readiness on each request.
        - Internal Garage addresses, storage keys, ORIGINAL video files, and processing assets are not exposed.

        Article representation:
        - Published `TEXT` and `EVENT` detail have one non-empty `body_markdown` string.
        - `EVENT` also has a required cover in `thumbnail_url` and null `asset_url`.
        - BANNER, VIDEO, and AUDIO detail return `body_markdown: null`.
        - `body_markdown` is not part of `ContentListItem`; clients obtain it from detail.
        - `body_markdown` marks every safe link with angle brackets so the mobile parser can detect it. An explicit link keeps its label, for example `[Ministère](<https://example.ma>)`. A bare absolute `http://` or `https://` URL is returned as an autolink, for example `<https://example.ma>`. The mobile client must treat both angle-bracket forms as links. Display them red, underlined, and clickable. Tapping a link opens that HTTP or HTTPS destination with the application's approved external or in-app browser. Do not treat other schemes, including `javascript:`, `data:`, and `file:`, as links. Presentation color is a client responsibility and is not encoded in the stored Markdown.
        - `source_name` and `source_reference` are always present and may be null when the editor did not supply a source.
        - Source documents remain internal.

        Because this endpoint documents `429`, the implementation must include
        the established `ContentReads` rate-limit policy.
      parameters:
      - name: content_id
        in: path
        required: true
        description: Content identifier (`content_id` from `GET /content`).
        schema:
          type: integer
          minimum: 1
        example: 44
      responses:
        '200':
          description: Published content detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContentDetail'
              examples:
                video:
                  value:
                    content_id: 44
                    thematic_id: 2
                    thematic_name: "Infections virales"
                    title: "Prévenir les hépatites virales"
                    summary: "Gestes de prévention et situations où demander conseil."
                    content_type: "VIDEO"
                    language: "fr"
                    is_highlighted: true
                    body_markdown:
                    asset_url: "https://media.example.msps.test/media/content/44/hls/asset-81-attempt-1/master.m3u8"
                    thumbnail_url: "https://media.example.msps.test/media/content/44/thumbnail/poster.jpg"
                    duration_seconds: 143
                    source_name: "MSPS"
                    source_reference: "Support officiel de sensibilisation aux hépatites"
                    published_at: "2026-08-09T11:00:00Z"
                event:
                  value:
                    content_id: 52
                    thematic_id: 4
                    thematic_name: "Général"
                    title: "Journée nationale de dépistage"
                    summary: "Une campagne gratuite de sensibilisation et de dépistage."
                    content_type: "EVENT"
                    language: "fr"
                    is_highlighted: false
                    body_markdown: "Une journée de dépistage sera organisée dans le centre régional.\n\nLa participation est gratuite et confidentielle."
                    asset_url:
                    thumbnail_url: "https://media.example.msps.test/media/content/52/thumbnail/event.webp"
                    duration_seconds:
                    source_name: "MSPS"
                    source_reference: "Campagne nationale de dépistage"
                    published_at: "2026-09-21T12:00:00Z"
                text_without_source:
                  value:
                    content_id: 61
                    thematic_id: 1
                    thematic_name: "VIH"
                    title: "Où trouver une information fiable"
                    summary: "Les liens officiels restent accessibles dans le texte."
                    content_type: "TEXT"
