  /events:
    post:
      tags: [Analytics]
      summary: Record a mobile analytics event
      description: |
        Records one mobile usage event for later dashboard reporting. Events are **append-only**;
        the API does not expose an internal event identifier in the response.

        Use this endpoint for screen views, content consultations, geolocation interactions,
        self-assessment events, chatbot events, notification opens, surveys,
        and referral-related analytics.

        Dashboard events. The AdminWeb analytics dashboard counts the six events below. The server
        checks each one exactly as described and answers `422 VALIDATION_ERROR` when a rule is not
        met, so an event the dashboard cannot use is never stored. Optional fields not listed
        (`region_id`, `province_id`, ...) are allowed. Other event names are free.

        `content_viewed`: one content consultation; there is no ContentView endpoint.
        - `module: content`, the consulted `content_id`, the content `language`, and `channel`
          mapped from the content type: `TEXT -> text`, `EVENT -> text`, `BANNER -> banner`,
          `AUDIO -> audio`, `VIDEO -> video`. (`infographic` is still accepted, like `banner`.)
        - Emit at most one `content_viewed` event per consultation when the consultation ends.
          Do not emit `content_viewed` periodically as a heartbeat.
        - `metadata.duration_sec` (required): elapsed consultation seconds, integer, 0 or more.
        - `metadata.completed` (optional boolean): only when the client can determine completion.
          It is especially useful for VIDEO and AUDIO; TEXT and BANNER may omit it.
        - No other metadata key.

        `notification_opened`: the user opened an in-app notification.
        - `module: notification`, `channel: notification`, the notification `language`, and
          `metadata.notification_id` (integer, 1 or more) from `GET /notifications`. No other key.

        `self_assessment_started`: the user started the self-assessment (first question shown).
        - `module: self_assessment`, no `channel`, the app `language`, and `metadata.quiz_id`
          (UUID) from `GET /assessment/quiz`. No other key.
        - Sent once per attempt. Completion is already recorded by `POST /assessment/results`, so
          there is no `self_assessment_completed` event.

        `center_search_performed`: the user filtered the list of screening centres.
        - Sent once, when the user leaves the centre finder, and only if during that visit they
          chose a filter (region, province, commune, operator). Opening the finder and leaving
          sends nothing.
        - `module: geo`, no `channel`.
        - `metadata` omitted, null, `{}`, or with only the optional booleans `used_text`,
          `used_filter`, `used_nearby` and `opened_center`. They are accepted for the app's sake
          and not counted. No other key.
        - Optional `region_id` / `province_id`: the last region or province filter applied.

        `center_map_redirected`: the user tapped « Ouvrir dans Maps » on a centre.
        - `module: geo`, no `channel`, the `center_id` of the centre. `metadata` omitted, null or `{}`.

        `center_called`: the user tapped « Appeler » on a centre.
        - `module: geo`, no `channel`, the `center_id` of the centre. `metadata` omitted, null or `{}`.

        Both `center_map_redirected` and `center_called` are referrals (« orientations ») on the
        Statistiques page, and a device that sent one counts as having looked for a centre. Do not
        send where the user came from: the server reads it from the same session. The source is
        `quiz` when a self-assessment was finished before the tap, `chatbot` when a chatbot step
        with the `open_centers` action was reached before it (its `chatbot_action_triggered`
        event), the later of the two when both happened, and `centres` otherwise.

        `center_id`, `region_id` and `province_id`, on any event, must exist; an unknown id returns
        `422 VALIDATION_ERROR` (`Invalid value for field 'center_id'.`).

        Chatbot convention (`module: chatbot`, `channel` omitted or null):
        - `event_name` is one of `chatbot_started`, `chatbot_step_viewed`,
          `chatbot_choice_selected`, `chatbot_action_triggered`, `chatbot_completed`.
        - `metadata` contains only `chat_run_id` (UUID generated by the client for each chatbot run),
          `scenario_id` (integer) and `step_key` (non-empty string), plus `choice_id` (integer),
          which is required for `chatbot_choice_selected` and omitted for the other events.
        - `chatbot_completed` is sent when a terminal `message` or `action` step is reached.
          For an `action` step, `chatbot_action_triggered` is sent immediately before it.
        - `scenario_id`, `step_key` and `choice_id` come from `GET /chatbot`. Use `step_key`, never
          translated labels or display order.
        - `step_key` is the step concerned by the event: the start step for `chatbot_started`, the
          viewed step for `chatbot_step_viewed`, the step that contains the selected choice (the
          source step, not its target) for `chatbot_choice_selected`, the action step for
          `chatbot_action_triggered`, and the terminal step for `chatbot_completed`.
        - `choice_id` is unique only within its scenario; always read it together with `scenario_id`.
        - Any other `metadata` key, or a missing required key, returns `422 VALIDATION_ERROR`.
          The server does not check that the ids exist.

        Optional `metadata` must not contain personal data, names, phone numbers, exact GPS
        coordinates, free-text health declarations, or full chatbot transcripts.

        Requires anonymous mobile bearer token from `POST /sessions`.

        The server derives the authoritative `device_uuid` and `session_id` from the JWT claims.
        Request body `device_uuid` and `session_id` are optional for compatibility; if provided,
        each value must match the JWT claim or the API returns `403 FORBIDDEN`. Normal mobile
        content events should omit both fields.
      security:
      - MobileAnonymousBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordAppEventRequest'
            example:
              event_name: "content_viewed"
              module: "content"
              content_id: 44
              language: "fr"
              channel: "video"
              metadata:
                duration_sec: 143
                completed: false
      responses:
        '202':
          description: Event accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AppEventAcceptedResponse'
              example:
                accepted: true
        '401':
          $ref: '#/components/responses/ProtectedMobileUnauthorized'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                field:
                  value:
                    error: "VALIDATION_ERROR"
                    message: "Invalid value for field 'channel'."
                convention:
                  value:
                    error: "VALIDATION_ERROR"
                    message: "center_map_redirected events must use module 'geo', no channel, a center_id, and no metadata."
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '403':
          $ref: '#/components/responses/Forbidden'
  /content/thematics:
