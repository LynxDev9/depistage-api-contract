openapi: 3.0.3
info:
  title: App API
  description: |
    **v2.3.0 — Mobile JWT ownership hardening (Phase 13 hotfix)**

    Security hardening for anonymous mobile bearer JWTs:
    - `GET /users/{device_uuid}` and `PATCH /users/{device_uuid}` now require `MobileAnonymousBearer`; the route `device_uuid` must match the JWT `device_uuid` claim.
    - `PATCH /sessions/{id}` requires the route `id` to match the JWT `session_id` claim.
    - `POST /events` derives `device_uuid` and `session_id` from the JWT. Body values are optional for client convenience, but when provided they must match the JWT claims.
    - `/geo/referrals` is scoped to the authenticated JWT `device_uuid`. Listing always returns only the caller device's referrals. Creating a referral requires the body `device_uuid` to match the JWT claim. Referral id operations return `404` when the referral does not belong to the authenticated device, to avoid revealing another device's referral existence.
    - A valid token used against the wrong route/body/query owner returns `403 FORBIDDEN`, except referral id ownership mismatches, which intentionally return `404 NOT_FOUND`.

    **v2.2.0 - Mobile content consumption API (Phase 19)**

    Additive, backward-compatible public read endpoints for published educational content:
    `GET /content/thematics`, `GET /content`, and `GET /content/{content_id}`.
    Content reads are public for the MVP; analytics and tracking remain separate through
    `POST /events`.
    Content `content_type` values intentionally use CMS content codes: `TEXT`,
    `INFOGRAPHIC`, `VIDEO`, and `AUDIO`.

    API contract for MSPS Dépistage — anonymous users, sessions, geolocation referentials, partner links, analytics ingestion, and published educational content.

    **v2.1.0 — Anonymous mobile bearer JWT (Phase 13)**

    Protected mobile **write** endpoints require `Authorization: Bearer <access_token>`.
    The token is a short-lived anonymous JWT returned by `POST /sessions` (and may be re-issued on
    `PATCH /sessions/{id}`). It represents an anonymous device/session only — no personal mobile
    accounts, no refresh tokens in the MVP.

    Device registration (`POST /users`) and session start (`POST /sessions`) remain callable without
    a bearer token so the app can bootstrap an anonymous session. Obtain the bearer token after
    device/profile registration by calling `POST /sessions`.

    **v2.0.0 — English snake_case (breaking change)**

    All public surfaces use **English snake_case**: URL paths, query parameters, JSON property names,
    and enum string literals (`youth`, `android`, `map` — not `YOUTH` / `ANDROID` / `MAP`).

    **Migration from v1.x**
    - Geo CMS JSON: `RegionID` / `Nom` / `Actif` → `region_id` / `name` / `is_active`
    - Paths: `/geo/centres` → `/geo/centers`; query `actif` → `active`
    - Path params: `categorie_id` → `category_id`, `centre_id` → `center_id`
    - Category schema: `Categorie` → `Category`; center: `Centre` → `Center`
    - `TypeMilieu` → `environment_type` with values `r`, `u`, `s`, `h` (lowercase)

    **Identifiers**
    - `region_id`, `province_id`, `commune_id`, `category_id`, `center_id` are database identity values.
    - `region_code`, `province_code`, `commune_code`, `geo_code` are optional import/source codes (admin).
  version: 2.3.0

